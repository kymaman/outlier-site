<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Аутлайнеры — наш ViewStats</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0f;--panel:#16161d;--line:#26263140;
--txt:#f2f2f5;--mut:#9a9aa8;--accent:#ff2d55}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);
font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 80px}
.logo{font-size:19px;font-weight:800;margin-bottom:2px}
.logo b{color:var(--accent)}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:9px;
-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:18px;background:var(--panel);
border:1px solid var(--line);font-size:12.5px;color:var(--mut);
white-space:nowrap;flex:0 0 auto;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
input.q{width:100%;background:var(--panel);border:1px solid var(--line);
border-radius:11px;padding:11px 14px;color:#fff;font-size:14px;outline:none;
margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media(max-width:660px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
overflow:hidden;position:relative}
.th{display:block;aspect-ratio:16/9;background:#000}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.mult{position:absolute;top:8px;left:8px;background:#000c;color:#ffcf33;
font-weight:800;font-size:13.5px;padding:4px 9px;border-radius:8px}
.fav{position:absolute;top:8px;right:8px;background:#000c;border:0;
border-radius:8px;font-size:15px;padding:4px 8px;cursor:pointer}
.fav.on{background:#ff2d55cc}
.vr{padding:8px 12px 0;font-size:13px;font-weight:650}
.body{padding:6px 12px 12px}
.t{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ru{color:var(--mut);font-size:12px;margin-top:3px;display:-webkit-box;
-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);
font-size:12px;margin-top:7px}
.meta .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{color:#ffcf33;font-weight:700;white-space:nowrap}
.own{background:linear-gradient(120deg,#ff2d5522,transparent 70%),var(--panel);
border:1px solid #ff2d5555;border-radius:13px;padding:11px 14px;margin-bottom:12px;
font-size:13.5px}
.own b{color:var(--accent)}
.empty{color:var(--mut);padding:28px;text-align:center;background:var(--panel);
border:1px dashed var(--line);border-radius:13px}
.upd{color:var(--mut);font-size:11.5px;text-align:center;margin-top:18px}
</style></head><body><div class="wrap">
<div class="logo">📊 Наш<b>ViewStats</b></div>
<div class="sub">Прорывные видео по темам · обновляется при каждом опросе базы</div>
<div id="own"></div>
<div class="chips" id="themes"></div>
<div class="chips" id="periods"></div>
<div class="chips" id="extra"></div>
<input class="q" id="q" type="search" placeholder="поиск по аутлайнерам…">
<div class="grid" id="grid"></div>
<div class="upd" id="upd"></div>
</div><script>
const THEME_LABEL={challenges:"🥊 Челленджи",music:"🎵 Музыка",
ai_construction:"🏗 Застройщики",ai_realestate:"🏠 Риелторы",
ai_cardealers:"🚗 Автодилеры"};
const PERIODS=[["","Всё время"],["1","День"],["7","Неделя"],["30","Месяц"],["90","3 мес"]];
const SUBS=[["","Люб. подписчики"],["micro","до 10K"],["small","10K–100K"],
["mid","100K–1M"],["big","1M+"]];
const SORTS=[["score","⭐ балл"],["mult","множитель"],["views","просмотры"],["new","новизна"]];
let S={theme:"",period:"",subs:"",fav:false,sort:"score",q:""};
let DATA={outliers:[],theme_counts:{}};
const favs=new Set(JSON.parse(localStorage.getItem("ovs_favs")||"[]"));
const fmt=n=>{n=+n||0;for(const[d,s]of[[1e9,"B"],[1e6,"M"],[1e3,"K"]])
if(n>=d)return(n/d).toFixed(1).replace(".0","")+s;return""+n};
const fmtM=m=>m>=10?"×"+Math.round(m):"×"+(+m).toFixed(1);
const cut=(iso,days)=>{if(!days)return true;const d=(iso||"").slice(0,10);
if(!d)return false;return(Date.now()-new Date(d))/864e5<=+days};
const inBucket=(s,b)=>{s=+s||0;return!b||(b=="micro"&&s<1e4)||(b=="small"&&s>=1e4&&s<1e5)
||(b=="mid"&&s>=1e5&&s<1e6)||(b=="big"&&s>=1e6)};
function chips(el,items,key,get){el.innerHTML=items.map(([v,l])=>
`<span class="chip ${get()==v?"on":""}" data-v="${v}">${l}</span>`).join("");
el.onclick=e=>{const c=e.target.closest(".chip");if(!c)return;
S[key]=c.dataset.v==="true"?true:c.dataset.v;render()}}
function card(r){const vid=r.video_id,fav=favs.has(vid);
const pub=(r.published||r.first_seen||"").slice(0,10);
const d=pub?` · 📅 ${pub.slice(8)}.${pub.slice(5,7)}`:"";
const ru=r.title_ru&&r.title_ru!=r.title?`<div class="ru">${esc(r.title_ru)}</div>`:"";
const subs=r.subscribers?` · ${fmt(r.subscribers)} подп.`:"";
return`<div class="card">
<a class="th" href="https://www.youtube.com/watch?v=${vid}" target="_blank">
<img loading="lazy" src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg"></a>
<span class="mult">${fmtM(r.multiplier)}</span>
<button class="fav ${fav?"on":""}" data-vid="${vid}">${fav?"❤":"🤍"}</button>
<div class="vr">👁 ${fmt(r.views)} просмотров${d}</div>
<div class="body"><a class="t" href="https://www.youtube.com/watch?v=${vid}"
target="_blank">${esc(r.title||"")}</a>${ru}
<div class="meta"><span class="cn">${esc(r.channel||"")}${subs}</span>
<span class="score">⭐ ${r.score??""}</span></div></div></div>`}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
const tc=DATA.theme_counts,total=Object.values(tc).reduce((a,b)=>a+b,0);
const tItems=[["",`Все ${total}`]];for(const t in THEME_LABEL)
if(tc[t])tItems.push([t,`${THEME_LABEL[t]} ${tc[t]}`]);
tItems.push(["__fav","❤ "+favs.size]);
chips(document.getElementById("themes"),tItems,"theme",()=>S.fav?"__fav":S.theme);
document.getElementById("themes").onclick=e=>{const c=e.target.closest(".chip");
if(!c)return;const v=c.dataset.v;if(v==="__fav"){S.fav=!S.fav}else{S.fav=false;S.theme=v}render()};
chips(document.getElementById("periods"),PERIODS,"period",()=>S.period);
chips(document.getElementById("extra"),[...SUBS,...SORTS.map(([v,l])=>["sort:"+v,l])],
"_x",()=>SUBS.some(([v])=>v===S.subs&&v)?S.subs:"sort:"+S.sort);
document.getElementById("extra").onclick=e=>{const c=e.target.closest(".chip");
if(!c)return;const v=c.dataset.v;
if(v.startsWith("sort:"))S.sort=v.slice(5);else S.subs=(S.subs===v?"":v);render()};
let rows=DATA.outliers.filter(r=>(!S.theme||r.theme===S.theme)
&&(!S.fav||favs.has(r.video_id))
&&cut(r.published||r.first_seen,S.period)&&inBucket(r.subscribers,S.subs)
&&(!S.q||((r.title||"")+(r.title_ru||"")+(r.channel||"")).toLowerCase().includes(S.q)));
rows.sort((a,b)=>S.sort=="mult"?b.multiplier-a.multiplier:
S.sort=="views"?b.views-a.views:
S.sort=="new"?((b.published||b.first_seen||"").localeCompare(a.published||a.first_seen||"")):
b.score-a.score);
document.getElementById("grid").innerHTML=rows.slice(0,150).map(card).join("")
||`<div class="empty">Пусто в этой выборке — попробуй период подлиннее.</div>`;
const own=DATA.own;document.getElementById("own").innerHTML=own?
`<div class="own">🎤 <b>${esc(own.title)}</b> · ${fmt(own.subs)} подписчиков ·
медиана ${fmt(own.median)} <span style="float:right">МОЙ КАНАЛ</span></div>`:"";
document.getElementById("upd").textContent="Обновлено: "+(DATA.generated||"—");}
document.getElementById("q").addEventListener("input",e=>{
S.q=e.target.value.toLowerCase();render()});
document.addEventListener("click",e=>{const b=e.target.closest(".fav");
if(!b)return;e.preventDefault();const v=b.dataset.vid;
favs.has(v)?favs.delete(v):favs.add(v);
localStorage.setItem("ovs_favs",JSON.stringify([...favs]));render()});
fetch("data.json?ts="+Date.now()).then(r=>r.json())
.then(d=>{DATA=d;render()})
.catch(()=>{document.getElementById("grid").innerHTML=
'<div class="empty">Не удалось загрузить данные</div>'});
</script></body></html>
